name: Template sync

# Keeps a repo made from learning-lab-template in step with it. Every Monday (or on demand) it runs
# scripts/template-sync.sh on a template-sync branch and opens a PR. Merge that PR with a merge
# commit, not a squash. On a conflict the run fails: run the script locally and resolve it there.
#
# GITHUB_TOKEN can't push changes to workflow files, and PRs it opens don't trigger CI. For full
# syncs, add a TEMPLATE_SYNC_TOKEN secret: a fine-grained token for this repo with Contents,
# Pull requests and Workflows set to read and write. Without it, also enable Settings → Actions →
# General → "Allow GitHub Actions to create and approve pull requests". See docs/Template.md.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: template-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge template updates
    # Not in the template itself: it has nothing to sync from.
    if: github.repository != 'LasterBergamot/learning-lab-template'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}

      - name: Merge
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=$(git rev-parse --abbrev-ref HEAD)   # the default branch, checked out above
          echo "base=$base" >> "$GITHUB_OUTPUT"
          git switch -c template-sync
          bash scripts/template-sync.sh
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$base")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the PR
        if: steps.merge.outputs.changed == 'true'
        env:
          BASE: ${{ steps.merge.outputs.base }}
        run: |
          git push --force origin template-sync
          if [ -z "$(gh pr list --head template-sync --state open --json number --jq '.[].number')" ]; then
            gh pr create --head template-sync --base "$BASE" \
              --title 'Sync with the template' \
              --body 'Changes from the template since the last sync (`scripts/template-sync.sh`). Merge with a **merge commit**, not a squash, so the next sync starts from here.'
          fi
